# Domli production stack (Community image only). Usage: see docs/domli/deployment.md
#   cp .env.production.example .env && edit .env
#   docker compose -f docker-compose.production.yml up -d
x-app: &app
  image: ${DOMLI_IMAGE:-ghcr.io/majidelmehammedy/domli:latest}
  env_file: .env
  environment: &app-env
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
  volumes:
    - storage_data:/app/storage
  restart: always

services:
  rails:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --header="X-Forwarded-Proto: https" http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 1536m }

  sidekiq:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    deploy:
      resources:
        limits: { memory: 1024m }

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis_data:/data

  bot:
    build: ./domli-bot
    restart: always
    env_file: ./domli-bot/.env
    volumes:
      - ./domli-bot/data:/app/data
      - ./domli-bot/knowledge:/app/knowledge:ro
    environment:
      CHATWOOT_URL: http://rails:3000
      ACCOUNTS_FILE: /app/data/accounts.json
      DATA_DIR: /app/data
      KNOWLEDGE_DIR: /app/knowledge
    depends_on: [rails]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [rails, bot]

volumes:
  storage_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
