# Copy to /etc/nginx/sites-enabled/bot.conf (the .conf ending matters), then:
#   nginx -t && systemctl reload nginx && certbot --nginx -d bot.domli.nl
server {
    listen 80;
    server_name bot.domli.nl;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
